{% extends 'main/base.html' %}

{% block title %}Топ по цене{% endblock %}

{% block content %}

<p><a href="{% url 'main:index' %}">← ко всем приложениям</a></p>

     <ul>
        {% for app in apps %}
        <li><a href="{% url 'main:app_detail' app.id %}">{{app.name}}</a> -

        {{app.price }}
        </li>
        {% empty %}
        <li>Платных приложений пока нет</li>
        {% endfor %}
    </ul>



{% endblock %}
