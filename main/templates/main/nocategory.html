{% extends 'main/base.html' %}

{% block title %}Приложения без категории{% endblock %}

{% block content %}

<p><a href="{% url 'main:index' %}">← ко всем приложениям</a></p>

     <ul>
        {% for app in apps %}

        {% endfor %}
    </ul>

{%endblock%}
